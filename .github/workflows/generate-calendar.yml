name: Generate ICS Calendars

on:
  push:
    branches:
      - main
    paths:
      - 'events_*.json'
      - 'generate.js'
      - 'audit.js'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit events data
        run: node audit.js

      - name: Generate ICS files
        run: node generate.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(auto): generate updated .ics files"
          file_pattern: "*.ics"
